name: Build APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Determine version
        id: version
        run: |
          RAW_TAG="${{ github.event.release.tag_name }}"
          if [ -n "$RAW_TAG" ]; then
            VERSION="${RAW_TAG#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set package.json version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Decode signing keystore
        working-directory: app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build signed release APK
        working-directory: app/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.version.outputs.version }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          export KEYSTORE_FILE="$(pwd)/release.keystore"
          ./gradlew assembleRelease

      - name: Remove decoded keystore
        if: always()
        working-directory: app/android
        run: rm -f release.keystore

      - name: Rename APK with version
        working-directory: app/android/app/build/outputs/apk/release
        run: mv app-release.apk "rozkazhy-${{ steps.version.outputs.version }}.apk"

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: app/android/app/build/outputs/apk/release/rozkazhy-${{ steps.version.outputs.version }}.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rozkazhy-${{ steps.version.outputs.version }}-apk
          path: app/android/app/build/outputs/apk/release/rozkazhy-${{ steps.version.outputs.version }}.apk

      - name: Commit version bump
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/package.json app/package-lock.json
          if git diff --cached --quiet; then
            echo "package.json already at ${{ steps.version.outputs.version }}, nothing to commit"
          else
            git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
