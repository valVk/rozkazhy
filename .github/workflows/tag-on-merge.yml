name: Tag on merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  tag:
    # Skip when the merged PR is itself a version-bump PR opened by this
    # workflow below — otherwise each bump-PR merge would trigger another
    # tag + another bump PR, forever.
    if: |
      github.event.pull_request.merged == true &&
      !startsWith(github.event.pull_request.head.ref, 'chore/version-bump-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next patch tag
        id: next
        run: |
          LATEST=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1)
          if [ -z "$LATEST" ]; then
            NEXT="0.0.1"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
            NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.next.outputs.tag }}"
          git push origin "${{ steps.next.outputs.tag }}"

      - name: Open version bump PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd app
          npm version "${{ steps.next.outputs.tag }}" --no-git-tag-version --allow-same-version
          cd ..
          git add app/package.json app/package-lock.json
          if git diff --cached --quiet; then
            echo "package.json already at ${{ steps.next.outputs.tag }}, nothing to bump"
            exit 0
          fi
          BRANCH="chore/version-bump-${{ steps.next.outputs.tag }}"
          git checkout -b "$BRANCH"
          git commit -m "chore: bump version to ${{ steps.next.outputs.tag }}"
          git push origin "$BRANCH"
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" \
            --title "chore: bump version to ${{ steps.next.outputs.tag }}" \
            --body "Automated version bump to match tag ${{ steps.next.outputs.tag }}."
          gh pr merge "$BRANCH" --squash --auto || gh pr merge "$BRANCH" --squash
